# Render Blueprint — free tier
# Deploy: connect this repo in Render Dashboard → New → Blueprint
#
# Uses a Background Worker (recommended for Telegram long-polling bots).
# Web Services on the free plan sleep after inactivity; workers stay running
# within the 750 free instance-hours/month limit.

services:
  - type: worker
    name: mafia-bot
    runtime: go
    plan: free
    region: oregon
    buildCommand: go build -ldflags="-s -w" -o bot ./cmd/bot
    startCommand: ./bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: mafia_bot
      - key: RENDER
        value: "true"
